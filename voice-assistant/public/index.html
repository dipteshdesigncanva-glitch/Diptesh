<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Voice Assistant</title>
  <style>
    :root { --bg: #faf9f7; --fg: #1f1e1c; --muted: #6b6860; --accent: #c96442; --card: #fff; --line: #e6e3dc; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1b19; --fg: #eeece6; --muted: #a09d94; --accent: #e08563; --card: #262522; --line: #3a3833; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    #status { color: var(--muted); margin: 0 0 24px; }
    #toggle { background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 12px 28px; font-size: 1rem; cursor: pointer; }
    #toggle:disabled { opacity: .6; cursor: default; }
    #log { list-style: none; padding: 0; margin: 32px 0 0; display: grid; gap: 8px; }
    #log li { padding: 10px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); max-width: 85%; }
    #log li.user { justify-self: end; }
  </style>
</head>
<body>
  <main>
    <h1>Claude Voice Assistant</h1>
    <p id="status">Ready</p>
    <button id="toggle">Start talking</button>
    <ol id="log" aria-live="polite"></ol>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
